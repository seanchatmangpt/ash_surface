name: Release

# Tag `v*` (CalVer, e.g. v26.9.18) => full gate set => source + hex tarballs =>
# SBOM => build-provenance attestation => artifacts. Publishing to hex is a
# SEPARATE job behind the `hex-publish` environment, which must be configured
# with required reviewers in repository settings: it is never automatic.
#
# Permissions are least-privilege per job. Attestation needs:
#   id-token: write      (OIDC token so Sigstore can sign the statement)
#   attestations: write  (store the attestation on the repository)
#   contents: read       (checkout)
# Verify a downloaded artifact with:
#   gh attestation verify <file> --repo seanchatmangpt/ash_surface
#
# Actions are pinned by version tag consistent with ci.yml; SHA pinning is a
# follow-up (docs/SUPPLY_CHAIN.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches mix.exs version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          test "$tag" = "$ver" || { echo "tag $tag != mix.exs $ver"; exit 1; }
      - name: CHANGELOG has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3"
          elixir-version: "1.20.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: npm ci
      - run: node --check priv/static/ash_surface_runtime.mjs
      - run: node --check priv/static/ash_surface_playwright.mjs
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test.all
      - run: mix test.zero
      - run: mix hex.audit
      - run: npm audit --omit=dev --audit-level=high
      - run: mix deps.unlock --check-unused

  build:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3"
          elixir-version: "1.20.3"
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - name: Source tarball (always producible)
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="ash_surface-${GITHUB_REF_NAME#v}/" \
            -o "dist/ash_surface-${GITHUB_REF_NAME#v}-src.tar.gz" HEAD
      - name: SBOM (CycloneDX, deterministic)
        run: scripts/sbom.sh "dist/ash_surface-${GITHUB_REF_NAME#v}.cdx.json"
      # ash_a2a / ash_r2rml are git dependencies; hex refuses packages that
      # depend on them ("Dependencies excluded from the package"), so this step
      # fails until they are published to hex. `hex_package` records the
      # outcome; the publish job below requires it to be `true`.
      - name: Hex package
        id: hex
        continue-on-error: true
        run: mix hex.build --output "dist/ash_surface-${GITHUB_REF_NAME#v}.tar"
      - name: Record hex build outcome
        run: echo "hex_package=${{ steps.hex.outcome == 'success' }}" | tee dist/HEX_BUILD_OUTCOME.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
    outputs:
      hex_built: ${{ steps.hex.outcome == 'success' }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Create draft release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Verify with gh attestation verify."

  # Manual approval gate. Configure environment `hex-publish` with required
  # reviewers; the job does not start until a human approves it in the UI.
  hex-publish:
    needs: build
    if: needs.build.outputs.hex_built == 'true'
    runs-on: ubuntu-latest
    environment: hex-publish
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3"
          elixir-version: "1.20.3"
      - run: mix local.hex --force
      - run: mix deps.get
      - name: Publish (HEX_API_KEY is an environment secret, not a repo secret)
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
